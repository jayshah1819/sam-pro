swagger: "2.0"
info:
  title: SAM Tracker
  description: Read-only, compact SAM Tracker API for Power Apps and Copilot Studio.
  version: "1.0"
host: api.samtracker.us
basePath: /connector
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  apiKey:
    type: apiKey
    in: header
    name: X-API-Key
security:
  - apiKey: []
paths:
  /vendors:
    get:
      operationId: SearchVendors
      summary: Search vendors
      description: Finds vendors by name, JDE number, contact email, or related contract text. Returns at most 50 results.
      parameters:
        - {name: q, in: query, required: false, type: string, description: Search text}
        - {name: limit, in: query, required: false, type: integer, default: 20, maximum: 50}
      responses:
        "200":
          description: OK
          schema:
            type: array
            items: {$ref: "#/definitions/VendorSummary"}
  /vendors/{vendorId}:
    get:
      operationId: GetVendor
      summary: Get a vendor with its contracts and licenses
      parameters:
        - {name: vendorId, in: path, required: true, type: integer}
        - {name: limit, in: query, required: false, type: integer, default: 20, maximum: 50}
      responses:
        "200":
          description: OK
          schema: {$ref: "#/definitions/VendorDetail"}
  /contracts:
    get:
      operationId: SearchContracts
      summary: Search contracts
      parameters:
        - {name: q, in: query, required: false, type: string}
        - {name: vendorId, in: query, required: false, type: integer}
        - name: status
          in: query
          required: false
          type: string
          description: Contract status (as returned in the status field)
        - {name: limit, in: query, required: false, type: integer, default: 20, maximum: 50}
      responses:
        "200":
          description: OK
          schema:
            type: array
            items: {$ref: "#/definitions/ContractSummary"}
definitions:
  VendorSummary:
    type: object
    properties:
      id: {type: integer}
      name: {type: string}
      jdeNumber: {type: string}
      website: {type: string}
      contactEmail: {type: string}
  ContractSummary:
    type: object
    properties:
      id: {type: integer}
      vendorId: {type: integer}
      vendorName: {type: string}
      contractNumber: {type: string}
      softwareName: {type: string}
      status: {type: string}
      startDate: {type: string, format: date}
      endDate: {type: string, format: date}
      value: {type: number}
  LicenseSummary:
    type: object
    properties:
      id: {type: integer}
      softwareName: {type: string}
      version: {type: string}
      status: {type: string}
      seats: {type: integer}
      price: {type: number}
      expiryDate: {type: string, format: date}
      location: {type: string}
  VendorDetail:
    type: object
    properties:
      vendor: {$ref: "#/definitions/VendorSummary"}
      contracts:
        type: array
        items: {$ref: "#/definitions/ContractSummary"}
      licenses:
        type: array
        items: {$ref: "#/definitions/LicenseSummary"}
