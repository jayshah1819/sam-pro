spring.application.name=sam-tracker

# DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# Production must use validate; apply the versioned SQL files in src/main/resources/db first.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.multiTenancy=DISCRIMINATOR
spring.jpa.properties.hibernate.multi_tenant_identifier_resolver=com.samtracker.tenant.TenantIdentifierResolver
spring.jpa.properties.hibernate.multi_tenant_identifier_resolver=com.samtracker.tenant.TenantIdentifierResolver

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# New registrations receive the VIEWER role and can sign in immediately.
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:true}

# Shared secret for the temporary /internal/purge-transactional-data endpoint.
app.purge.token=${PURGE_TOKEN:}

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# Server
server.port=8080
server.address=${SERVER_ADDRESS:0.0.0.0}
# Behind ALB/App Runner set FRAMEWORK so X-Forwarded-* is honoured; otherwise every
# request looks like it comes from the proxy and login throttling buckets all users together.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NONE}

