spring.application.name=sam-tracker

# DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# Production must use validate; apply the versioned SQL files in src/main/resources/db first.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.multiTenancy=DISCRIMINATOR
spring.jpa.properties.hibernate.multi_tenant_identifier_resolver=com.samtracker.tenant.TenantIdentifierResolver
spring.jpa.properties.hibernate.multi_tenant_identifier_resolver=com.samtracker.tenant.TenantIdentifierResolver

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Public registration is disabled by default. Enable only behind an approved onboarding flow.
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# Server
server.port=8080

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
